  <!-- 3 Home -->
  <g transform="translate(1056 140)"><text class="frameTitle" x="0" y="0">03 · Home</text><g transform="translate(0 16) scale(.72)"><use xlink:href="#phone"/><text class="serif" x="22" y="125">A little clarity,</text><text class="serif" x="22" y="154">daily.</text><text class="small" x="24" y="180">Saturday, 14 November</text><rect class="navy" x="20" y="198" width="350" height="205" rx="20"/><text class="white" x="40" y="228" style="font:11px Arial">LEFT TO SPEND THIS WEEK</text><text class="white" x="40" y="295" style="font:600 54px Arial">₹680</text><rect x="40" y="320" width="310" height="8" rx="4" fill="#dce3e9"/><rect class="gold" x="40" y="320" width="210" height="8" rx="4"/><text class="white" x="40" y="360" style="font:12px Arial">₹320 spent</text><text class="white" x="350" y="360" text-anchor="end" style="font:12px Arial">On track</text><rect class="card" x="20" y="420" width="350" height="145" rx="20"/><text class="bold" x="40" y="450">This week by day</text><g fill="#1760a8"><rect x="48" y="505" width="24" height="40" rx="5"/><rect x="91" y="490" width="24" height="55" rx="5"/><rect x="134" y="512" width="24" height="33" rx="5"/><rect x="177" y="476" width="24" height="69" rx="5"/><rect x="220" y="525" width="24" height="20" rx="5"/><rect x="263" y="530" width="24" height="15" rx="5"/><rect x="306" y="520" width="24" height="25" rx="5"/></g><text class="label" x="20" y="600">WHERE IT WENT</text><text class="bold" x="45" y="637">Food</text><text class="small" x="45" y="655">₹240 of ₹450</text><text class="bold" x="350" y="646" text-anchor="end">₹240</text><text class="bold" x="45" y="701">Transport</text><text class="small" x="45" y="719">₹80 of ₹250</text><text class="bold" x="350" y="710" text-anchor="end">₹80</text></g></g>
