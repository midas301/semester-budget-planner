  <g transform="translate(306 1440)"><text class="frameTitle" x="0" y="0">07 · Insights</text><g transform="translate(0 16) scale(.72)"><use xlink:href="#phone"/><text class="serif" x="22" y="127">See the bigger picture.</text><text class="small" x="22" y="155">Your habits today. Your semester ahead.</text><rect class="card" x="20" y="177" width="350" height="282" rx="20"/><text class="serif" x="40" y="214" style="font-size:22px">November</text><text class="label" x="350" y="212" text-anchor="end">1–30 NOV</text><circle cx="112" cy="323" r="69" fill="none" stroke="#1760a8" stroke-width="24" stroke-dasharray="180 254" transform="rotate(-90 112 323)"/><circle cx="112" cy="323" r="69" fill="none" stroke="#efb231" stroke-width="24" stroke-dasharray="95 339" stroke-dashoffset="-180" transform="rotate(-90 112 323)"/><circle cx="112" cy="323" r="69" fill="none" stroke="#397c64" stroke-width="24" stroke-dasharray="55 379" stroke-dashoffset="-275" transform="rotate(-90 112 323)"/><text class="bold" x="112" y="319" text-anchor="middle">₹3,240</text><text class="small" x="112" y="338" text-anchor="middle">this month</text><circle class="blue" cx="218" cy="280" r="5"/><text class="body" x="231" y="284">Food</text><text class="bold" x="348" y="284" text-anchor="end">₹1,840</text><circle class="gold" cx="218" cy="323" r="5"/><text class="body" x="231" y="327">Transport</text><text class="bold" x="348" y="327" text-anchor="end">₹940</text><circle fill="#397c64" cx="218" cy="366" r="5"/><text class="body" x="231" y="370">Study</text><text class="bold" x="348" y="370" text-anchor="end">₹460</text><rect class="card" x="20" y="477" width="350" height="190" rx="20"/><text class="serif" x="40" y="515" style="font-size:22px">Semester projection</text><text class="body" x="40" y="545">At this pace, your funds should last</text><text class="body" x="40" y="565">through your semester.</text><rect class="line" x="40" y="589" width="310" height="8" rx="4"/><rect class="blue" x="40" y="589" width="112" height="8" rx="4"/><text class="small" x="40" y="618">Plan ₹10,000 · spent ₹3,240</text><text class="small" x="350" y="638" text-anchor="end">Remaining ₹6,760</text></g></g>
