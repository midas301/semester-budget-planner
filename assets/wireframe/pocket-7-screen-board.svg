  <text x="58" y="82" class="boardSub">Seven editable screen concepts · Android 390 × 844 · warm paper / navy / action blue</text>
  <text x="58" y="104" class="small">Import this SVG into Figma, ungroup, place each phone in its own frame, then add prototype links from the map below.</text>
