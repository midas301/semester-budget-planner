  <g transform="translate(556 790)"><text class="frameTitle" x="0" y="0">05 · Budget alert</text><g transform="translate(0 16) scale(.72)"><use xlink:href="#phone"/><text class="red" x="22" y="122" style="font:700 11px Arial">⚠  OVER BUDGET</text><text class="serif" x="22" y="165">A quick budget</text><text class="serif" x="22" y="194">check.</text><text class="small" x="22" y="222">This week · Nov 9–15</text><rect x="20" y="245" width="350" height="116" rx="19" fill="#fbedeb"/><text class="label" x="40" y="275">LEFT TO SPEND THIS WEEK</text><text class="red" x="40" y="326" style="font:600 42px Arial">−₹180</text><text class="small" x="40" y="347">₹1,180 spent of ₹1,000</text><rect class="card" x="20" y="382" width="350" height="115" rx="19"/><text class="bold" x="40" y="414">This week by day</text><g fill="#bd4038"><rect x="55" y="450" width="25" height="28" rx="4"/><rect x="100" y="438" width="25" height="40" rx="4"/><rect x="145" y="430" width="25" height="48" rx="4"/><rect x="190" y="420" width="25" height="58" rx="4"/><rect x="235" y="428" width="25" height="50" rx="4"/><rect x="280" y="410" width="25" height="68" rx="4"/></g><rect class="card" x="20" y="515" width="350" height="186" rx="20" stroke="#bd4038" stroke-width="2"/><rect x="40" y="535" width="100" height="24" rx="12" fill="#fbedeb"/><text class="red" x="90" y="551" text-anchor="middle" style="font:700 9px Arial">OVER BUDGET</text><text class="serif" x="40" y="592" style="font-size:23px">You’re over this week.</text><text class="small" x="40" y="617">It happens. A small adjustment now can</text><text class="small" x="40" y="635">help keep your semester on track.</text><rect class="blue" x="40" y="650" width="310" height="42" rx="11"/><text class="white" x="195" y="676" text-anchor="middle" style="font:700 13px Arial">Adjust my plan</text><text class="blue" x="195" y="730" text-anchor="middle" style="font:700 13px Arial">Got it</text></g></g>
  <!-- 6 Week review -->
  <g transform="translate(1056 790)"><text class="frameTitle" x="0" y="0">06 · Week review</text><g transform="translate(0 16) scale(.72)"><use xlink:href="#phone"/><text class="serif" x="22" y="127">Your week, unpacked.</text><rect class="card" x="20" y="153" width="350" height="48" rx="12"/><text class="blue" x="44" y="184">‹</text><text class="bold" x="195" y="184" text-anchor="middle">Nov 9 – Nov 15</text><text class="blue" x="345" y="184" text-anchor="end">›</text><rect class="navy" x="20" y="216" width="350" height="94" rx="18"/><text class="white" x="38" y="244" style="font:10px Arial">BUDGET</text><text class="white" x="38" y="278" style="font:600 22px Arial">₹1,000</text><text class="white" x="154" y="244" style="font:10px Arial">SPENT</text><text class="white" x="154" y="278" style="font:600 22px Arial">₹720</text><text class="white" x="270" y="244" style="font:10px Arial">LEFT</text><text class="white" x="270" y="278" style="font:600 22px Arial">₹280</text><text class="serif" x="22" y="349" style="font-size:22px">By category</text><text class="bold" x="22" y="382">Food</text><text class="small" x="350" y="382" text-anchor="end">₹420 / ₹450</text><rect class="line" x="22" y="392" width="346" height="6" rx="3"/><rect class="blue" x="22" y="392" width="323" height="6" rx="3"/><text class="bold" x="22" y="429">Transport</text><text class="small" x="350" y="429" text-anchor="end">₹180 / ₹250</text><rect class="line" x="22" y="439" width="346" height="6" rx="3"/><rect class="blue" x="22" y="439" width="249" height="6" rx="3"/><text class="serif" x="22" y="492" style="font-size:22px">Transaction history</text><circle class="soft" cx="43" cy="532" r="17"/><text class="bold" x="72" y="530">Lunch · Food</text><text class="small" x="72" y="548">Today · 12:24 pm</text><text class="bold" x="320" y="535" text-anchor="end">₹120</text><text class="blue" x="360" y="541" text-anchor="end" style="font:700 10px Arial">Edit</text><circle class="soft" cx="43" cy="592" r="17"/><text class="bold" x="72" y="590">Bus · Transport</text><text class="small" x="72" y="608">Yesterday</text><text class="bold" x="320" y="595" text-anchor="end">₹40</text><text class="blue" x="360" y="601" text-anchor="end" style="font:700 10px Arial">Edit</text></g></g>
