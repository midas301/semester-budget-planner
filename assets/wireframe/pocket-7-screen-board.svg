<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="2260" viewBox="0 0 1500 2260">
  <defs>
    <style>
      .board { fill:#f0f2f4 } .frame { fill:#f7f6f2; stroke:#d0d7de; stroke-width:2 }
      .card { fill:#fff } .navy { fill:#0c2e50 } .blue { fill:#1760a8 } .soft { fill:#eaf3fb }
      .line { fill:#e0e5e9 } .muted { fill:#596b7d } .gold { fill:#efb231 } .red { fill:#bd4038 }
      .ink { fill:#132d47 } .paper { fill:#f7f6f2 } .serif { font: 500 24px Georgia,serif; fill:#0c2e50 }
