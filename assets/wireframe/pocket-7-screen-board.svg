  <!-- 1 Semester setup -->
  <g transform="translate(56 140)"><text class="frameTitle" x="0" y="0">01 · Semester setup</text><g transform="translate(0 16) scale(.72)"><use xlink:href="#phone"/><text class="serif" x="24" y="126">Make this semester</text><text class="serif" x="24" y="155">yours.</text><text class="small" x="24" y="184">Start with what you have. We'll help it go further.</text><text class="label" x="24" y="228">SEMESTER NAME</text><use xlink:href="#field" x="20" y="238"/><text class="label" x="24" y="320">STARTS</text><rect class="card" x="20" y="330" width="164" height="50" rx="9" stroke="#e0e5e9"/><text class="small" x="35" y="360">01 Nov 2026</text><text class="label" x="202" y="320">ENDS</text><rect class="card" x="195" y="330" width="175" height="50" rx="9" stroke="#e0e5e9"/><text class="small" x="208" y="360">10 Jan 2027</text><text class="label" x="24" y="421">TOTAL AVAILABLE FOR SEMESTER</text><rect class="card" x="20" y="432" width="350" height="58" rx="9" stroke="#e0e5e9"/><text class="body" x="35" y="467">₹  10,000</text><rect class="soft" x="20" y="510" width="350" height="100" rx="18"/><text class="label" x="38" y="538">YOUR WEEKLY BUDGET</text><text class="serif" x="38" y="574" style="font-size:34px">₹ 1,000 <tspan class="small">/ week</tspan></text><use xlink:href="#primary" x="20" y="672"/><text class="small" x="195" y="740" text-anchor="middle">No bank connection needed</text></g></g>
  <!-- 2 Category plan -->
