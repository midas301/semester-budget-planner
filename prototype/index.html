<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semester Budget Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">
    <section id="welcome" class="screen active">
      <h1>Semester Budget Planner</h1>
      <p>Make your money last the whole semester.</p>
      <button data-goto="home">Get started</button>
    </section>

    <section id="setup" class="screen">
        <h2>Set up your budget</h2>
      
        <label for="total">Total money for the semester (₹)</label>
        <input id="total" type="number" min="1" placeholder="e.g. 30000">
      
        <label for="weeks">Semester length (weeks)</label>
        <input id="weeks" type="number" min="1" value="20">
      
        <p id="setup-error" class="error" hidden>Enter a budget and number of weeks greater than 0.</p>
      
        <button id="create-budget">Create my budget</button>
        <button data-goto="welcome" class="secondary">Back</button>
      </section>

      <section id="add" class="screen">
        <h2>Add expense</h2>
      
        <label for="amount">Amount (₹)</label>
        <input id="amount" type="number" min="1" placeholder="e.g. 120">
      
        <label>Category</label>
        <div class="chips" id="categories">
          <button class="chip selected" data-cat="Food">Food</button>
          <button class="chip" data-cat="Travel">Travel</button>
          <button class="chip" data-cat="Shopping">Shopping</button>
          <button class="chip" data-cat="Other">Other</button>
        </div>
      
        <p id="add-error" class="error" hidden>Enter an amount greater than 0.</p>
      
        <button id="save-expense">Save expense</button>
        <button data-goto="home" class="secondary">Cancel</button>
      </section>

    <section id="home" class="screen">
      <h2>Home</h2>
      <button data-goto="welcome">Back</button>
      <h3>Recent expenses</h3>
      <ul id="expense-list"></ul>
      <button data-goto="add">+ Add expense</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
